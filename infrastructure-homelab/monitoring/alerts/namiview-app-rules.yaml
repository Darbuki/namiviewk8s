apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: namiview-app-rules
  namespace: monitoring
  labels:
    release: monitoring-stack
spec:
  groups:
    - name: namiview-api
      interval: 30s
      rules:
        - alert: HighHTTPErrorRate
          expr: |
            sum by (namespace) (rate(http_requests_total{handler=~"/api.*", status=~"5.."}[5m]))
            /
            sum by (namespace) (rate(http_requests_total{handler=~"/api.*"}[5m]))
            > 0.05
          for: 5m
          labels:
            severity: warning
            component: api
          annotations:
            summary: "namiview-api 5xx rate above 5% in {{ $labels.namespace }}"
            description: "{{ $value | humanizePercentage }} of /api/* requests returned 5xx over the last 5m."

        - alert: APIPodCrashLoop
          expr: |
            sum by (namespace, pod) (rate(kube_pod_container_status_restarts_total{namespace=~"namiview(-dev)?", pod=~"namiview-api.*"}[15m])) > 0
          for: 10m
          labels:
            severity: critical
            component: api
          annotations:
            summary: "namiview-api pod {{ $labels.pod }} restarting"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarted in the last 15m; investigate `kubectl logs --previous`."

    - name: namiview-worker
      interval: 30s
      rules:
        # Absolute count, not a ratio. Prod runs ~19 jobs/day, so one failure is
        # already 100% of a 10m window — the old rate-based threshold was
        # statistically meaningless and, because 0/0 is NaN, it could never fire
        # on an idle queue either.
        - alert: WorkerJobFailures
          expr: |
            sum by (namespace) (increase(namiview_worker_jobs_completed_total{job=~"namiview-worker.*", status!="success"}[1h])) > 0
          for: 5m
          labels:
            severity: warning
            component: worker
          annotations:
            summary: "{{ $value | printf \"%.0f\" }} worker job(s) failed in {{ $labels.namespace }} in the last hour"
            description: "Inspect with `kubectl -n {{ $labels.namespace }} logs -l app.kubernetes.io/name=namiview-worker`. Failed messages redrive to the DLQ — see JobDLQNotEmpty."

        - alert: WorkerDown
          expr: |
            up{job=~"namiview-worker.*"} == 0
          for: 5m
          labels:
            severity: critical
            component: worker
          annotations:
            summary: "namiview-worker scrape target down: {{ $labels.namespace }}/{{ $labels.instance }}"
            description: "Prometheus cannot scrape the worker metrics endpoint. Pod down or metrics server not running."

        - alert: WorkerJobsStalled
          expr: |
            avg_over_time(namiview_worker_jobs_in_flight{job=~"namiview-worker.*"}[15m]) > 0
            and
            sum by (namespace) (rate(namiview_worker_jobs_completed_total{job=~"namiview-worker.*"}[15m])) == 0
          for: 15m
          labels:
            severity: warning
            component: worker
          annotations:
            summary: "worker has in-flight jobs but none completing in {{ $labels.namespace }}"
            description: "Jobs are in flight for 15m+ with zero completion rate. Likely a hang or model load issue."

        # The real liveness signal. A healthy *idle* worker still long-polls SQS
        # roughly 3x/min per replica, so this is volume-independent: it fires
        # when the poll loop itself dies, which no job-count alert can detect.
        # Deliberately not an "are jobs arriving?" alert — measured over 14d,
        # prod's longest legitimately silent stretch was 155h, so any such rule
        # would be pure noise.
        - alert: WorkerPollingStopped
          expr: |
            sum by (namespace) (rate(namiview_worker_poll_iterations_total{job=~"namiview-worker.*"}[10m])) == 0
            and
            sum by (namespace) (up{job=~"namiview-worker.*"}) > 0
          for: 10m
          labels:
            severity: critical
            component: worker
          annotations:
            summary: "namiview-worker in {{ $labels.namespace }} is up but has stopped polling SQS"
            description: "The worker process is being scraped but its SQS long-poll loop has produced no iterations for 10m. Uploads will queue silently. Restart the deployment if logs show no `worker_ready`."

    # Queue-side view, from CloudWatch via yace. These catch 'jobs are not being
    # processed' independently of how many jobs there are — the gap that let a
    # healthy-looking dashboard hide a broken pipeline.
    - name: namiview-jobs-queue
      interval: 30s
      rules:
        - alert: JobStuckInQueue
          expr: |
            aws_sqs_approximate_age_of_oldest_message_maximum{dimension_QueueName=~"namiview-prod(-dev)?-jobs"} > 900
          for: 10m
          labels:
            severity: critical
            component: worker
          annotations:
            summary: "oldest message in {{ $labels.dimension_QueueName }} is {{ $value | humanizeDuration }} old"
            description: "A job has been sitting unprocessed for 15m+ (a normal job completes in ~5-8s). The worker is not draining the queue."

        - alert: JobQueueBacklog
          expr: |
            aws_sqs_approximate_number_of_messages_visible_maximum{dimension_QueueName=~"namiview-prod(-dev)?-jobs"} > 5
          for: 15m
          labels:
            severity: warning
            component: worker
          annotations:
            summary: "{{ $value | printf \"%.0f\" }} messages backed up in {{ $labels.dimension_QueueName }}"
            description: "Jobs are arriving faster than the worker drains them. Consider scaling replicaCount."

        - alert: JobDLQNotEmpty
          expr: |
            aws_sqs_approximate_number_of_messages_visible_maximum{dimension_QueueName=~"namiview-prod(-dev)?-jobs-dlq"} > 0
          for: 5m
          labels:
            severity: warning
            component: worker
          annotations:
            summary: "{{ $value | printf \"%.0f\" }} message(s) in DLQ {{ $labels.dimension_QueueName }}"
            description: "Jobs exhausted their SQS redrive attempts and were permanently dropped. The user's upload never completed. Inspect the DLQ payloads for the failing job_id."

    - name: namiview-cronjobs
      interval: 30s
      rules:
        - alert: AtlasIPSyncStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{cronjob="atlas-ip-sync"} > 3600
          for: 0m
          labels:
            severity: critical
            component: cronjob
          annotations:
            summary: "atlas-ip-sync hasn't succeeded in over 1h"
            description: "If this stays red, MongoDB Atlas will eventually block writes when our public IP rotates."

        - alert: ECRRefreshStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{cronjob="ecr-refresh"} > 25200
          for: 0m
          labels:
            severity: warning
            component: cronjob
          annotations:
            summary: "ecr-refresh stale in {{ $labels.namespace }} (>7h since success)"
            description: "Pull secret will expire (12h ECR token TTL). Image pulls will start failing soon."
